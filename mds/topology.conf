# rawstor-mds topology: the OSTs mds:// objects are placed on.
#
# One line per OST:
#
#   <uuid> <location> <weight> <server>[/<rack>[/<row>[/<dc>]]]
#
#   <uuid>      The OST's own id, stable for its whole life; generate one
#               with `cat /proc/sys/kernel/random/uuid` and never reuse or
#               change it (chunks are recorded against it).
#   <location>  A single location URI the clients reach the OST at, e.g.
#               ost://host:port.
#   <weight>    Relative share of new chunks placed on this OST, e.g. its
#               capacity in GiB.
#   <server>... Failure domains, leaf first: the server the OST runs on,
#               then optionally its rack, row and datacenter. Copies of one
#               chunk are spread across the level the object's
#               --failure-domain names (server by default).
#
# '#' starts a comment. After editing, apply without a restart:
#
#   systemctl reload rawstor-mds
#
# An OST still holding chunks can't be removed from this file: the reload
# (and a restart) is refused and the current topology kept.
# See docs/mds.md in the librawstor sources for the design.
#
# Example: two OSTs on two servers in one rack.
#
# 018f4e2a-1000-7000-8000-000000000001 ost://host1:7777 100 host1/rack1/row1/dc1
# 018f4e2a-1000-7000-8000-000000000002 ost://host2:7777 100 host2/rack1/row1/dc1
