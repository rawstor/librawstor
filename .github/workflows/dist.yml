name: dist

on:
  push:

jobs:
  linter:

    runs-on: ubuntu-latest

    # Reads contributor-controlled commit metadata: the token needs no
    # more than checkout access, whatever the repository default is.
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: commit-messages
      run: ./.github/tools/commit-messages.sh
    - name: add llvm 21
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
    - name: clang-format
      run: ./.github/tools/clang-format.sh

  docs:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: docs/requirements.txt
    - name: install dependencies
      run: pip install -r docs/requirements.txt
    - name: mkdocs build --strict
      run: mkdocs build --strict
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sources:

    runs-on: ubuntu-latest

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev liburing-dev libgtest-dev python3-build
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make distcheck
      run: make -j$(nproc) distcheck
    - uses: actions/upload-artifact@v7
      with:
        name: sources
        path: librawstor-*.tar.gz
        if-no-files-found: error

  sources-unittest:
    needs: sources

    runs-on: ubuntu-latest

    strategy:
      matrix:
        without-liburing:
        -
        - --without-liburing
        include:
        - packages: liburing-dev
          without-liburing:

    env:
      ASAN_OPTIONS: detect_odr_violation=0
    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev libgtest-dev python3-build ${{ matrix.packages }}
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --enable-asan ${{ matrix.without-liburing }}
    - name: make
      run: |
        cd ${LIBRAWSTOR}
        make -j${nproc}
    - name: make test
      run: |
        cd ${LIBRAWSTOR}
        make test

  sources-testio:
    needs: sources

    runs-on: ubuntu-latest

    strategy:
      matrix:
        without-liburing:
        - 
        - --without-liburing
        include:
        - packages: liburing-dev
          without-liburing:

    env:
      asan_options: detect_odr_violation=0
    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev python3-build ${{ matrix.packages }}
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --enable-asan --disable-tests --without-python3 ${{ matrix.without-liburing }}
    - name: make
      run: |
        cd ${LIBRAWSTOR}
        make -j${nproc}
    - name: start rawstor-ost
      run: |
        mkdir /tmp/ost_objects
        ./${LIBRAWSTOR}/ost/src/rawstor-ost --insecure --bind 127.0.0.1:7777 file:///tmp/ost_objects/ &
        sleep 10
    - name: create object file,ost
      run: |
        mkdir /tmp/file_objects
        target=$(./${LIBRAWSTOR}/cli/rawstor --insecure object create file:///tmp/file_objects,ost://127.0.0.1:7777 --size=1G --mirrors=2 --format value --column target)
        echo "TARGET=${target}" >> $GITHUB_ENV
        ./${LIBRAWSTOR}/cli/rawstor --insecure object list file:///tmp/file_objects,ost://127.0.0.1:7777
    - name: testio file,ost
      run: |
        ./${LIBRAWSTOR}/cli/rawstor --insecure testio ${TARGET} --block-size=4K --io-depth=1 --count=10
        ./${LIBRAWSTOR}/cli/rawstor --insecure testio ${TARGET} --block-size=4K --io-depth=1 --count=10 --vector-mode
    - name: create object ost,file
      run: |
        target=$(./${LIBRAWSTOR}/cli/rawstor --insecure object create ost://127.0.0.1:7777,file:///tmp/file_objects --size=1G --mirrors=2 --format value --column target)
        echo "TARGET=${target}" >> $GITHUB_ENV
        ./${LIBRAWSTOR}/cli/rawstor --insecure object list ost://127.0.0.1:7777,file:///tmp/file_objects
    - name: testio ost,file
      run: |
        ./${LIBRAWSTOR}/cli/rawstor --insecure testio ${TARGET} --block-size=4K --io-depth=1 --count=10
        ./${LIBRAWSTOR}/cli/rawstor --insecure testio ${TARGET} --block-size=4K --io-depth=1 --count=10 --vector-mode
    - name: stop rawstor-ost
      # One OST at a time: a second one next to it leaves the queue of the next
      # client without the memory it needs (rawio_queue_create() fails with
      # ENOMEM), so the plain one goes before the TLS one starts.
      run: |
        killall rawstor-ost
        while pgrep -x rawstor-ost > /dev/null; do sleep 0.2; done
    - name: TLS, issue the certificates
      run: |
        mkdir /tmp/pki /tmp/tls_ost_objects /tmp/tls_file_objects
        cd /tmp/pki
        RAWSTOR=${GITHUB_WORKSPACE}/${LIBRAWSTOR}/cli/rawstor
        TD=cluster.example
        OST_ID=$(cat /proc/sys/kernel/random/uuid)
        # The CA needs no TLS itself, so these run without any settings.
        ${RAWSTOR} pki init --trust-domain ${TD} ca
        ${RAWSTOR} pki issue --ca ca --cert ost.pem --key ost.key ost ${OST_ID}
        ${RAWSTOR} pki issue --ca ca --cert cli.pem --key cli.key admin ci
        ${RAWSTOR} pki renew --ca ca --cert ost.pem --key ost.key
        # A certificate of another CA is not renewed.
        ${RAWSTOR} pki init --trust-domain ${TD} other
        ! ${RAWSTOR} pki renew --ca other --cert ost.pem --key ost.key
        for who in ost cli; do
          echo "RAWSTOR_TLS_TRUST_DOMAIN=${TD} RAWSTOR_TLS_CERT=/tmp/pki/${who}.pem RAWSTOR_TLS_KEY=/tmp/pki/${who}.key RAWSTOR_TLS_CA=/tmp/pki/ca/ca.crt" > ${who}.env
        done
    - name: TLS, start rawstor-ost
      run: |
        env $(cat /tmp/pki/ost.env) ./${LIBRAWSTOR}/ost/src/rawstor-ost --bind 127.0.0.1:7778 file:///tmp/tls_ost_objects/ &
        sleep 10
    - name: TLS, provider creates and inspects objects
      run: |
        cli() { env $(cat /tmp/pki/cli.env) ./${LIBRAWSTOR}/cli/rawstor "$@"; }
        target=$(cli object create file:///tmp/tls_file_objects,ost://127.0.0.1:7778 --size=1G --mirrors=2 --format value --column target)
        cli object list file:///tmp/tls_file_objects,ost://127.0.0.1:7778
        cli object show ${target}
    - name: TLS, a peer without a certificate is refused
      run: |
        ! ./${LIBRAWSTOR}/cli/rawstor --insecure location info ost://127.0.0.1:7778
        status=0
        ./${LIBRAWSTOR}/cli/rawstor location info ost://127.0.0.1:7778 || status=$?
        test ${status} -eq 78
    - name: stop rawstor_ost
      run: killall rawstor-ost
    - name: TLS tenant authorization
      run: python3 ./${LIBRAWSTOR}/tests/security_authorization.py ./${LIBRAWSTOR}

  deb-librawstor:
    needs: sources

    runs-on: ubuntu-latest

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev liburing-dev libsqlite3-dev debhelper build-essential
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-python3 --disable-tests
        make deb/librawstor/changelog
    - name: dpkg-buildpackage
      run: |
        cd ${LIBRAWSTOR}
        mkdir debian
        mkdir debian/source
        cp deb/librawstor/control debian
        cp deb/librawstor/compat debian
        cp deb/librawstor/changelog debian
        cp deb/librawstor/format debian/source
        cp deb/librawstor/librawstor.install debian
        cp deb/librawstor/librawstor-dev.install debian
        cp deb/librawstor/rawstor-ost.install debian
        cp deb/librawstor/rawstor-ost.postinst debian
        cp deb/librawstor/rawstor-ost.prerm debian
        cp deb/librawstor/rawstor-vhost.install debian
        cp deb/librawstor/rawstor-vhost.postinst debian
        cp deb/librawstor/rawstor-vhost.prerm debian
        cp deb/librawstor/rawstor-vduse.install debian
        cp deb/librawstor/rawstor-vduse.postinst debian
        cp deb/librawstor/rawstor-vduse.prerm debian
        cp deb/librawstor/rawstor-mds.install debian
        cp deb/librawstor/rawstor-mds.postinst debian
        cp deb/librawstor/rawstor-mds.prerm debian
        cp deb/librawstor/rules debian
        cp COPYING debian/copyright
        dpkg-buildpackage -us -uc
    - name: changelog
      run: |
        echo "# changelog" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${LIBRAWSTOR}/debian/changelog >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: ls
      run: |
        for i in librawstor_*.deb librawstor-dev_*.deb rawstor-ost_*.deb rawstor-vhost_*.deb rawstor-vduse_*.deb rawstor-mds_*.deb *.ddeb; do \
          [ -e "$i" ] || continue; \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          dpkg --contents $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: librawstor.deb
        path: |
          librawstor_*.deb
          librawstor-dev_*.deb
          rawstor-ost_*.deb
          rawstor-vhost_*.deb
          rawstor-vduse_*.deb
          rawstor-mds_*.deb
          *.ddeb
        if-no-files-found: error

  deb-python3-rawstor:
    needs:
    - sources
    - deb-librawstor

    strategy:
      matrix:
        os:
        # ubuntu-22.04 ships liburing 2.1, too old for the io_uring APIs this
        # codebase uses (needs >=2.3) -- can't build or run there at all.
        - ubuntu-24.04
        - ubuntu-26.04

    runs-on: ${{ matrix.os }}

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev liburing-dev python3-build debhelper dh-python python3-all-dev build-essential pkg-config
    - uses: actions/download-artifact@v8
    - name: install librawstor
      run: |
        sudo apt install -y ./librawstor.deb/librawstor_*.deb
        sudo apt install -y ./librawstor.deb/librawstor-dev_*.deb
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(cd sources && ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: make
      run: |
        tar -xzf sources/${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-sqlite3 --disable-tests
        make deb/python3-rawstor/changelog
    - name: dpkg-buildpackage
      run: |
        cd ${LIBRAWSTOR}/pyrawstor
        mkdir debian
        mkdir debian/source
        cp ../deb/python3-rawstor/control debian
        cp ../deb/python3-rawstor/compat debian
        cp ../deb/python3-rawstor/changelog debian
        cp ../deb/python3-rawstor/format debian/source
        cp ../deb/python3-rawstor/rules debian
        cp ../COPYING debian/copyright
        dpkg-buildpackage -us -uc
        mv ../python*-rawstor_*.deb ${GITHUB_WORKSPACE}
        mv ../python*-rawstor-dbgsym_*.ddeb ${GITHUB_WORKSPACE} 2> /dev/null || true
    - name: changelog
      run: |
        echo "# changelog" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${LIBRAWSTOR}/pyrawstor/debian/changelog >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: ls
      run: |
        for i in python*-rawstor_*.deb python*-rawstor-dbgsym_*.ddeb; do \
          [ -e "$i" ] || continue; \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          dpkg --contents $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor-${{ matrix.os }}.deb
        path: |
          python*-rawstor_*.deb
          python*-rawstor-dbgsym_*.ddeb
        if-no-files-found: error

  deb-install:
    needs:
    - deb-librawstor
    - deb-python3-rawstor

    strategy:
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/download-artifact@v8
    - name: install-librawstor
      run: sudo apt install -y ./librawstor.deb/librawstor_*.deb
    - name: test-librawstor
      run: rawstor --version
    - name: issue-certificates
      # A service has no way to run without TLS, so each one gets a
      # certificate; the clients below (the rawstor CLI, rawstor-vhost and
      # python) share one, from the environment. The CA is a throwaway, so
      # the keys are readable by the rawstor user, which the packages have not
      # made yet.
      run: |
        sudo install -d /etc/rawstor/tls
        mkdir /tmp/pki
        cd /tmp/pki
        rawstor pki init --trust-domain cluster.example ca
        rawstor pki issue --ca ca --cert ost.crt --key ost.key ost 018f4e2a-1111-7000-8000-000000000001
        rawstor pki issue --ca ca --cert mds.crt --key mds.key mds 018f4e2a-3333-7000-8000-000000000001
        rawstor pki issue --ca ca --cert cli.crt --key cli.key admin ci
        sudo install -m 0644 ca/ca.crt /etc/rawstor/tls/ca.crt
        for who in ost mds cli; do
          sudo install -m 0644 ${who}.crt ${who}.key /etc/rawstor/tls/
          printf 'RAWSTOR_TLS_TRUST_DOMAIN=cluster.example\nRAWSTOR_TLS_CERT=/etc/rawstor/tls/%s.crt\nRAWSTOR_TLS_KEY=/etc/rawstor/tls/%s.key\nRAWSTOR_TLS_CA=/etc/rawstor/tls/ca.crt\n' ${who} ${who} | sudo tee /etc/rawstor/tls/${who}.settings
        done
        cat /etc/rawstor/tls/cli.settings >> $GITHUB_ENV
    - name: install-rawstor-ost
      # Installing starts nothing: an instance runs once its
      # /etc/rawstor/ost/<uuid>.conf exists.
      run: |
        sudo apt install -y ./librawstor.deb/rawstor-ost_*.deb
        (echo "BIND_ADDR=127.0.0.1:7777"; cat /etc/rawstor/tls/ost.settings) | sudo tee /etc/rawstor/ost/018f4e2a-1111-7000-8000-000000000001.conf
        sudo systemctl enable --now rawstor-ost@018f4e2a-1111-7000-8000-000000000001.service
        sleep 1
    - name: test-rawstor-ost
      run: |
        rawstor-ost --version
        rawstor object create --size=1M --mirrors=1 ost://127.0.0.1:7777
        rawstor object list ost://127.0.0.1:7777
    - name: install-rawstor-vhost
      run: sudo apt install -y ./librawstor.deb/rawstor-vhost_*.deb
    - name: test-rawstor-vhost
      run: |
        CREATED=$(rawstor object create --size=1M --mirrors=1 ost://127.0.0.1:7777 --format value --column object_id,target)
        read -r UUID TARGET <<< "${CREATED}"
        sudo cp /etc/rawstor/tls/cli.settings /etc/rawstor-vhost.conf
        # Provider admin credentials may inspect/read objects, but cannot write.
        # Tenant write access through MDS capabilities is covered by sources-testio.
        sudo mkdir -p /etc/systemd/system/rawstor-vhost@${UUID}.service.d
        printf '[Service]\nExecStart=\nExecStart=/usr/bin/rawstor-vhost --readonly --socket-path=/run/rawstor/%%i.sock ost://127.0.0.1:7777/%%i\n' | sudo tee /etc/systemd/system/rawstor-vhost@${UUID}.service.d/readonly.conf
        sudo systemctl daemon-reload
        sudo systemctl enable --now rawstor-vhost@${UUID}.service
        sleep 1
        systemctl is-active rawstor-vhost@${UUID}.service
        test -S /run/rawstor/${UUID}.sock
        sudo systemctl disable --now rawstor-vhost@${UUID}.service
    - name: install-rawstor-vduse
      # No vduse kernel module on GitHub-hosted runners -- same reasoning
      # as rawstor-vhost's own confirm-it-runs-only test above, one step
      # further: not even the module load is guaranteed here, so this
      # only confirms the package installs and the binary runs.
      run: sudo apt install -y ./librawstor.deb/rawstor-vduse_*.deb
    - name: test-rawstor-vduse
      run: rawstor-vduse --version
    - name: install-rawstor-mds
      # Start the instance with an empty topology, then list the one OST
      # there and reload.
      run: |
        sudo apt install -y ./librawstor.deb/rawstor-mds_*.deb
        (echo "BIND_ADDR=127.0.0.1:7776"; cat /etc/rawstor/tls/mds.settings) | sudo tee /etc/rawstor/mds/018f4e2a-3333-7000-8000-000000000001.conf
        sudo touch /etc/rawstor/mds/018f4e2a-3333-7000-8000-000000000001.topology
        sudo systemctl enable --now rawstor-mds@018f4e2a-3333-7000-8000-000000000001.service
        sleep 1
        systemctl is-active rawstor-mds@018f4e2a-3333-7000-8000-000000000001.service
        echo "018f4e2a-1111-7000-8000-000000000001 ost://127.0.0.1:7777 100 data,witness dc1/row1/rack1/host1" | sudo tee /etc/rawstor/mds/018f4e2a-3333-7000-8000-000000000001.topology
        # reload only sends SIGHUP; give the MDS a moment to swap the
        # topology in, then confirm it did.
        sudo systemctl reload rawstor-mds@018f4e2a-3333-7000-8000-000000000001.service
        sleep 2
        sudo journalctl -u rawstor-mds@018f4e2a-3333-7000-8000-000000000001.service --no-pager | grep 'Topology reloaded from /etc/rawstor/mds/018f4e2a-3333-7000-8000-000000000001.topology'
    - name: test-rawstor-mds
      # The OST instance (started above) is still running -- reuse it as
      # the mds:// volume's one chunk member.
      run: |
        rawstor-mds --version
        rawstor object create -t mds://127.0.0.1:7776/018f4e2a-2222-7000-8000-000000000001 --size=1M --chunk-size=1M --mirrors=1
        rawstor object resize mds://127.0.0.1:7776/018f4e2a-2222-7000-8000-000000000001 --size=2M
    - name: install-python3-rawstor
      run: sudo apt install -y ./python3-rawstor-${{ matrix.os }}.deb/python*-rawstor_*.deb
    - name: test-python3-rawstor
      run: python -c "import rawstor; print(list(rawstor.Location('ost://127.0.0.1:7777/').objects())); print('OK')"

  rpm-librawstor:
    needs: sources

    runs-on: ubuntu-latest

    container: almalinux:9

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
        dnf -y install xxhash-devel openssl-devel liburing-devel sqlite-devel gcc-c++ make pkgconfig systemd-rpm-macros rpm-build rpmlint
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-python3 --disable-tests
    - name: setuptree
      run: |
        mkdir -p ~/rpmbuild/SOURCES
        mkdir -p ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR}/rpm/librawstor.spec ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR_TAR_GZ} ~/rpmbuild/SOURCES
    - name: rpmlint
      run: rpmlint ~/rpmbuild/SPECS/librawstor.spec
    - name: rpmbuild
      run: rpmbuild -bb ~/rpmbuild/SPECS/librawstor.spec
    - name: ls
      run: |
        cd ~/rpmbuild/RPMS/x86_64
        for i in *.rpm; do \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          rpm -qlp $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: librawstor.rpm
        path: ~/rpmbuild/RPMS/x86_64/*.rpm
        if-no-files-found: error

  rpm-python3-rawstor:
    needs:
    - sources
    - rpm-librawstor

    strategy:
      matrix:
        os:
        - almalinux9
        - almalinux10
        include:
        - os: almalinux9
          image: almalinux:9
        - os: almalinux10
          image: almalinux:10

    runs-on: ubuntu-latest

    container: ${{ matrix.image }}

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
        dnf -y install xxhash-devel openssl-devel liburing-devel gcc-c++ make pkgconfig python3-devel python3-rpm-macros python3-pip python3-wheel python3-build python3-setuptools rpm-build rpmlint
    - uses: actions/download-artifact@v8
    - name: install librawstor
      run: dnf -y install ./librawstor.rpm/librawstor-[0-9]*.rpm ./librawstor.rpm/librawstor-devel-*.rpm
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(cd sources && ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf sources/${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-sqlite3 --disable-tests
    - name: setuptree
      run: |
        mkdir -p ~/rpmbuild/SOURCES
        mkdir -p ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR}/rpm/python3-rawstor.spec ~/rpmbuild/SPECS
        cp sources/${LIBRAWSTOR_TAR_GZ} ~/rpmbuild/SOURCES
    - name: rpmlint
      run: rpmlint ~/rpmbuild/SPECS/python3-rawstor.spec
    - name: rpmbuild
      run: rpmbuild -bb ~/rpmbuild/SPECS/python3-rawstor.spec
    - name: ls
      run: |
        cd ~/rpmbuild/RPMS/x86_64
        for i in *.rpm; do \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          rpm -qlp $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor-${{ matrix.os }}.rpm
        path: ~/rpmbuild/RPMS/x86_64/*.rpm
        if-no-files-found: error

  rpm-install:
    needs:
    - rpm-librawstor
    - rpm-python3-rawstor

    strategy:
      matrix:
        os:
        - almalinux9
        - almalinux10
        include:
        - os: almalinux9
          image: almalinux:9
        - os: almalinux10
          image: almalinux:10

    runs-on: ubuntu-latest

    # rawstor-ost uses io_uring at runtime, which the default container
    # seccomp profile blocks (build/install steps never execute it, only
    # this job actually runs the binary).
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
    - uses: actions/download-artifact@v8
    - name: install-librawstor
      run: dnf -y install ./librawstor.rpm/librawstor-[0-9]*.rpm
    - name: test-librawstor
      run: rawstor --version
    - name: issue-certificates
      # The binaries run by hand below, and a process has no way to run without
      # TLS unless it is told to: each gets a certificate, and the clients (the
      # rawstor CLI and python) share one, from the environment.
      run: |
        mkdir /tmp/pki
        cd /tmp/pki
        rawstor pki init --trust-domain cluster.example ca
        rawstor pki issue --ca ca --cert ost.crt --key ost.key ost 018f4e2a-1111-7000-8000-000000000001
        rawstor pki issue --ca ca --cert mds.crt --key mds.key mds
        rawstor pki issue --ca ca --cert cli.crt --key cli.key admin ci
        for who in ost mds cli; do
          echo "RAWSTOR_TLS_TRUST_DOMAIN=cluster.example RAWSTOR_TLS_CERT=/tmp/pki/${who}.crt RAWSTOR_TLS_KEY=/tmp/pki/${who}.key RAWSTOR_TLS_CA=/tmp/pki/ca/ca.crt" > ${who}.env
        done
        for setting in $(cat cli.env); do echo "${setting}" >> $GITHUB_ENV; done
    - name: install-rawstor-ost
      run: dnf -y install ./librawstor.rpm/rawstor-ost-[0-9]*.rpm
    - name: test-rawstor-ost
      # containers have no systemd/PID 1, so the .service unit cannot be
      # started via systemctl here -- run the same command it would, by hand.
      run: |
        rawstor-ost --version
        mkdir -p /var/lib/rawstor/ost/test
        env $(cat /tmp/pki/ost.env) rawstor-ost --bind=127.0.0.1:7777 file:///var/lib/rawstor/ost/test &
        OST_PID=$!
        sleep 10
        rawstor object create --size=1M --mirrors=1 ost://127.0.0.1:7777
        rawstor object list ost://127.0.0.1:7777
        kill ${OST_PID}
    - name: install-rawstor-vhost
      run: dnf -y install ./librawstor.rpm/rawstor-vhost-[0-9]*.rpm
    - name: test-rawstor-vhost
      # containers have no systemd/PID 1, so the @-instance unit cannot be
      # started via systemctl here -- just confirm the binary is installed.
      run: rawstor-vhost --version
    - name: install-rawstor-vduse
      run: dnf -y install ./librawstor.rpm/rawstor-vduse-[0-9]*.rpm
    - name: test-rawstor-vduse
      # no vduse kernel module in this container either -- same
      # confirm-it-runs-only reasoning as rawstor-vhost above.
      run: rawstor-vduse --version
    - name: install-rawstor-mds
      run: |
        dnf -y install ./librawstor.rpm/rawstor-mds-[0-9]*.rpm
        test -d /etc/rawstor/mds
    - name: test-rawstor-mds
      # containers have no systemd/PID 1, so the .service unit cannot be
      # started via systemctl here -- run the same command it would, by
      # hand, against a fresh OST (the earlier test-rawstor-ost's own OST
      # was already killed at the end of that step).
      run: |
        rawstor-mds --version
        mkdir -p /var/lib/rawstor/ost/test
        env $(cat /tmp/pki/ost.env) rawstor-ost --bind=127.0.0.1:7777 file:///var/lib/rawstor/ost/test &
        OST_PID=$!
        sleep 10
        echo "018f4e2a-1111-7000-8000-000000000001 ost://127.0.0.1:7777 100 data,witness dc1/row1/rack1/host1" > /tmp/topology.conf
        env $(cat /tmp/pki/mds.env) rawstor-mds --bind=127.0.0.1:7776 --db=/tmp/mds.db --topology=/tmp/topology.conf &
        MDS_PID=$!
        sleep 5
        rawstor object create -t mds://127.0.0.1:7776/018f4e2a-2222-7000-8000-000000000001 --size=1M --chunk-size=1M --mirrors=1
        kill ${MDS_PID} ${OST_PID}
    - name: install-python3-rawstor
      run: dnf -y install ./python3-rawstor-${{ matrix.os }}.rpm/python3*-rawstor-[0-9]*.rpm
    - name: test-python3-rawstor
      run: |
        mkdir -p /tmp/rawstor-install-test
        python3 -c "import rawstor; print(list(rawstor.Location('file:///tmp/rawstor-install-test').objects())); print('OK')"

  wheel:
    needs:
    - sources
    - rpm-librawstor

    runs-on: ubuntu-latest

    # almalinux:9 (same base rpm-librawstor already builds against) gives
    # the wheel's manylinux_2_34 glibc floor -- consistent with the
    # distros this project already supports (no Ubuntu 22.04, no RHEL8).
    container: almalinux:9

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
        dnf -y install xxhash-devel openssl-devel liburing-devel gcc-c++ make pkgconfig python3-devel python3-pip python3-wheel python3-build python3-setuptools patchelf
        python3 -m pip install auditwheel
    - uses: actions/download-artifact@v8
    - name: install librawstor
      run: dnf -y install ./librawstor.rpm/librawstor-[0-9]*.rpm ./librawstor.rpm/librawstor-devel-*.rpm
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(cd sources && ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf sources/${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-sqlite3 --disable-tests
    - name: build wheel and sdist
      # a single cp39-abi3 build works unmodified on every Python >= 3.9
      # (see pyrawstor/setup.py), so one wheel covers the whole matrix --
      # no per-Python-version build needed.
      run: |
        cd ${LIBRAWSTOR}/pyrawstor
        python3 -m build --no-isolation --outdir ${GITHUB_WORKSPACE}/dist .
    - name: compute auditwheel excludes
      # Thin wheel: everything the extension links against beyond the
      # baseline glibc/libstdc++ pieces manylinux always assumes present
      # must come from the system (matching python3-rawstor's deb/rpm
      # dependency on librawstor), not get vendored into the wheel by
      # auditwheel. Derive the exclude list from `ldd`'s full transitive
      # resolution of the built .so -- not just its own direct NEEDED
      # entries, since liburing/libxxhash are only pulled in transitively
      # via librawstor.so itself -- instead of hand-listing sonames, so a
      # soname bump (e.g. librawstor's own, which tracks its major
      # version) or a future new dependency is excluded automatically
      # instead of silently vendored if nobody remembers to update this
      # step.
      run: |
        mkdir -p /tmp/wheel-inspect
        python3 -m zipfile -e ${GITHUB_WORKSPACE}/dist/*.whl /tmp/wheel-inspect
        # Every extension of the wheel, not one: there are several.
        DEPS=$(find /tmp/wheel-inspect -name '*.so' -exec ldd {} + | awk '$2 == "=>" {print $1}' | sort -u)
        ALLOW='^(libc\.so\.|libm\.so\.|libpthread\.so\.|libdl\.so\.|librt\.so\.|libstdc\+\+\.so\.|libgcc_s\.so\.)'
        EXCLUDES=""
        for lib in ${DEPS}; do
          if ! echo "${lib}" | grep -Eq "${ALLOW}"; then
            EXCLUDES="${EXCLUDES} --exclude ${lib}"
          fi
        done
        echo "found deps: ${DEPS}" >> $GITHUB_STEP_SUMMARY
        echo "excluding from wheel: ${EXCLUDES}" >> $GITHUB_STEP_SUMMARY
        echo "AUDITWHEEL_EXCLUDES=${EXCLUDES}" >> $GITHUB_ENV
    - name: auditwheel repair
      # PyPI rejects a plain "linux_x86_64" platform tag, so the wheel
      # still needs auditwheel's manylinux tag rewrite -- the excludes
      # computed above keep everything system-provided OUT of the wheel.
      run: |
        python3 -m auditwheel repair \
          ${AUDITWHEEL_EXCLUDES} \
          ${GITHUB_WORKSPACE}/dist/*.whl -w ${GITHUB_WORKSPACE}/wheelhouse
    - name: auditwheel show
      run: |
        echo "# auditwheel show" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        python3 -m auditwheel show ${GITHUB_WORKSPACE}/wheelhouse/*.whl >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor.whl
        path: wheelhouse/*.whl
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor.sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  wheel-install:
    needs:
    - deb-librawstor
    - wheel

    strategy:
      matrix:
        include:
        # setup-python has no Python 3.9 for ubuntu-26.04 (end of life), but
        # the thin wheel is built for every Python >= 3.9, and librawstor.deb
        # installs on both Ubuntu releases (deb-install).
        - os: ubuntu-24.04
          python-version: "3.9"
        - os: ubuntu-26.04
          python-version: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions/download-artifact@v8
      with:
        name: librawstor.deb
        path: librawstor.deb
    - name: install-librawstor
      # the wheel is thin (librawstor/liburing/libxxhash excluded from it,
      # see the wheel job) -- it's on the user to have librawstor
      # installed already, same as the python3-rawstor deb/rpm packages.
      run: sudo apt install -y ./librawstor.deb/librawstor_*.deb
    - uses: actions/download-artifact@v8
      with:
        name: python3-rawstor.whl
        path: wheelhouse
    - name: install-python3-rawstor
      run: pip install wheelhouse/*.whl
    - name: test-python3-rawstor
      # librawstor starts with TLS settings only, so the test makes some with
      # the wheel's own rawstor.pki, which does not start it.
      run: |
        mkdir -p /tmp/rawstor-wheel-install-test /tmp/pki
        python -c "
        from rawstor import pki
        pki.init('/tmp/pki/ca', 'cluster.example')
        pki.issue_admin('/tmp/pki/ca', 'ci', '/tmp/pki/cli.crt', '/tmp/pki/cli.key')
        "
        export RAWSTOR_TLS_TRUST_DOMAIN=cluster.example
        export RAWSTOR_TLS_CERT=/tmp/pki/cli.crt
        export RAWSTOR_TLS_KEY=/tmp/pki/cli.key
        export RAWSTOR_TLS_CA=/tmp/pki/ca/ca.crt
        python -c "import rawstor; print(list(rawstor.Location('file:///tmp/rawstor-wheel-install-test').objects())); print('OK')"

  release:
    needs:
    - linter
    - docs
    - sources
    - sources-unittest
    - sources-testio
    - deb-librawstor
    - deb-python3-rawstor
    - deb-install
    - rpm-librawstor
    - rpm-python3-rawstor
    - rpm-install
    - wheel
    - wheel-install

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg
    - uses: actions/checkout@v7
      with:
        path: librawstor
        fetch-depth: 0
    - name: fetch tags
      run: |
        cd librawstor
        git fetch --tags --force origin
    - name: import GPG public keys
      run: gpg --import librawstor/.github/gpg-keys/*.asc
    - name: verify
      run: |
        cd librawstor
        git verify-tag ${{ github.ref_name }}
    - uses: actions/download-artifact@v8
      with:
        path: ./artifacts
    - name: build release notes
      # GitHub Releases has no folder/grouping support for the assets
      # list itself -- it's always one flat, alphabetically-sorted list.
      # This is the workaround: a curated, categorized index (plus this
      # version's ChangeLog.md section) in the release body, on top of
      # (not instead of) that flat list.
      run: |
        librawstor/.github/tools/release-notes.sh \
          "${{ github.ref_name }}" ./artifacts "${{ github.repository }}" \
          librawstor/ChangeLog.md \
          > "${{ github.workspace }}/release-notes.md"
    - uses: softprops/action-gh-release@v3
      with:
        working_directory: ./artifacts
        body_path: ${{ github.workspace }}/release-notes.md
        files: |
          librawstor.deb/*
          python3-rawstor-*.deb/*
          librawstor.rpm/*
          python3-rawstor-*.rpm/*
          python3-rawstor.whl/*
          python3-rawstor.sdist/*
          sources/*

  pypi:
    needs:
    - wheel
    - release

    runs-on: ubuntu-latest
    # Temporarily disabled: the wheel/sdist already land on the GitHub
    # Release (see release's `files:`) -- hold off on PyPI publishing until
    # the thin-wheel approach has been confirmed working end-to-end and the
    # PyPI trusted-publisher/environment setup is in place.
    if: false
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python3-rawstor.whl
        path: dist
    - uses: actions/download-artifact@v8
      with:
        name: python3-rawstor.sdist
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
