name: dist

on:
  push:

jobs:
  clang-format:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: add llvm 21
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
    - name: clang-format
      run: ./.github/tools/clang-format.sh

  sources:

    runs-on: ubuntu-latest

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev liburing-dev libgtest-dev python3-build
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure
    - name: make distcheck
      run: make distcheck
    - uses: actions/upload-artifact@v7
      with:
        name: sources
        path: librawstor-*.tar.gz
        if-no-files-found: error

  sources-unittest:
    needs: sources

    runs-on: ubuntu-latest

    strategy:
      matrix:
        without-liburing:
        -
        - --without-liburing
        include:
        - packages: liburing-dev
          without-liburing:

    env:
      ASAN_OPTIONS: detect_odr_violation=0
    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libgtest-dev python3-build ${{ matrix.packages }}
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --enable-asan ${{ matrix.without-liburing }}
    - name: make
      run: |
        cd ${LIBRAWSTOR}
        make -j${nproc}
    - name: make test
      run: |
        cd ${LIBRAWSTOR}
        make test

  sources-testio:
    needs: sources

    runs-on: ubuntu-latest

    strategy:
      matrix:
        without-liburing:
        - 
        - --without-liburing
        include:
        - packages: liburing-dev
          without-liburing:

    env:
      asan_options: detect_odr_violation=0
    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev python3-build ${{ matrix.packages }}
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --enable-asan --disable-tests --without-python3 ${{ matrix.without-liburing }}
    - name: make
      run: |
        cd ${LIBRAWSTOR}
        make -j${nproc}
    - name: start rawstor-ost
      run: |
        mkdir /tmp/ost_objects
        ./${LIBRAWSTOR}/ost/rawstor-ost --bind 127.0.0.1:7777 file:///tmp/ost_objects/ &
        sleep 10
    - name: create object file,ost
      run: |
        mkdir /tmp/file_objects
        target=$(./${LIBRAWSTOR}/cli/rawstor-cli create file:///tmp/file_objects,ost://127.0.0.1:7777 --size=1G)
        echo "TARGET=${target}" >> $GITHUB_ENV
        ./${LIBRAWSTOR}/cli/rawstor-cli list file:///tmp/file_objects,ost://127.0.0.1:7777
    - name: testio file,ost
      run: |
        ./${LIBRAWSTOR}/cli/rawstor-cli testio ${TARGET} --block-size=4K --io-depth=1 --count=10
        ./${LIBRAWSTOR}/cli/rawstor-cli testio ${TARGET} --block-size=4K --io-depth=1 --count=10 --vector-mode
    - name: create object ost,file
      run: |
        target=$(./${LIBRAWSTOR}/cli/rawstor-cli create ost://127.0.0.1:7777,file:///tmp/file_objects --size=1G)
        echo "TARGET=${target}" >> $GITHUB_ENV
        ./${LIBRAWSTOR}/cli/rawstor-cli list ost://127.0.0.1:7777,file:///tmp/file_objects
    - name: testio ost,file
      run: |
        ./${LIBRAWSTOR}/cli/rawstor-cli testio ${TARGET} --block-size=4K --io-depth=1 --count=10
        ./${LIBRAWSTOR}/cli/rawstor-cli testio ${TARGET} --block-size=4K --io-depth=1 --count=10 --vector-mode
    - name: stop rawstor_ost
      run: killall rawstor-ost

  deb-librawstor:
    needs: sources

    runs-on: ubuntu-latest

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev liburing-dev libgtest-dev debhelper build-essential
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-python3
        make deb/librawstor/changelog
    - name: dpkg-buildpackage
      run: |
        cd ${LIBRAWSTOR}
        mkdir debian
        mkdir debian/source
        cp deb/librawstor/control debian
        cp deb/librawstor/compat debian
        cp deb/librawstor/changelog debian
        cp deb/librawstor/format debian/source
        cp deb/librawstor/librawstor.install debian
        cp deb/librawstor/librawstor-dev.install debian
        cp deb/librawstor/rawstor-ost.install debian
        cp deb/librawstor/rawstor-ost.postinst debian
        cp deb/librawstor/rawstor-ost.prerm debian
        cp deb/librawstor/rules debian
        cp systemd/rawstor-ost.service debian
        cp COPYING debian/copyright
        dpkg-buildpackage -us -uc
    - name: changelog
      run: |
        echo "# changelog" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${LIBRAWSTOR}/debian/changelog >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: ls
      run: |
        for i in librawstor_*.deb librawstor-dev_*.deb rawstor-ost_*.deb *.ddeb; do \
          [ -e "$i" ] || continue; \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          dpkg --contents $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: librawstor.deb
        path: |
          librawstor_*.deb
          librawstor-dev_*.deb
          rawstor-ost_*.deb
          *.ddeb
        if-no-files-found: error

  deb-python3-rawstor:
    needs:
    - sources
    - deb-librawstor

    strategy:
      matrix:
        os:
        # ubuntu-22.04 ships liburing 2.1, too old for the io_uring APIs this
        # codebase uses (needs >=2.3) -- can't build or run there at all.
        - ubuntu-24.04
        - ubuntu-26.04

    runs-on: ${{ matrix.os }}

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev liburing-dev libgtest-dev python3-build debhelper dh-python python3-all-dev build-essential pkg-config
    - uses: actions/download-artifact@v8
    - name: install librawstor
      run: |
        sudo apt install -y ./librawstor.deb/librawstor_*.deb
        sudo apt install -y ./librawstor.deb/librawstor-dev_*.deb
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(cd sources && ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: make
      run: |
        tar -xzf sources/${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure
        make deb/python3-rawstor/changelog
    - name: dpkg-buildpackage
      run: |
        cd ${LIBRAWSTOR}/pyrawstor
        mkdir debian
        mkdir debian/source
        cp ../deb/python3-rawstor/control debian
        cp ../deb/python3-rawstor/compat debian
        cp ../deb/python3-rawstor/changelog debian
        cp ../deb/python3-rawstor/format debian/source
        cp ../deb/python3-rawstor/rules debian
        cp ../COPYING debian/copyright
        dpkg-buildpackage -us -uc
        mv ../python*-rawstor_*.deb ${GITHUB_WORKSPACE}
        mv ../python*-rawstor-dbgsym_*.ddeb ${GITHUB_WORKSPACE} 2> /dev/null || true
    - name: changelog
      run: |
        echo "# changelog" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat ${LIBRAWSTOR}/pyrawstor/debian/changelog >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: ls
      run: |
        for i in python*-rawstor_*.deb python*-rawstor-dbgsym_*.ddeb; do \
          [ -e "$i" ] || continue; \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          dpkg --contents $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor-${{ matrix.os }}.deb
        path: |
          python*-rawstor_*.deb
          python*-rawstor-dbgsym_*.ddeb
        if-no-files-found: error

  deb-install:
    needs:
    - deb-librawstor
    - deb-python3-rawstor

    strategy:
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/download-artifact@v8
    - name: install-librawstor
      run: sudo apt install -y ./librawstor.deb/librawstor_*.deb
    - name: test-librawstor
      run: rawstor-cli --version
    - name: install-rawstor-ost
      run: |
        sudo apt install -y ./librawstor.deb/rawstor-ost_*.deb
        sudo systemctl start rawstor-ost.service
    - name: test-rawstor-ost
      run: |
        rawstor-ost --version
        rawstor-cli create --size=1M ost://127.0.0.1:7777
        rawstor-cli list ost://127.0.0.1:7777
    - name: test-rawstor-vhost
      run: |
        TARGET=$(rawstor-cli create --size=1M ost://127.0.0.1:7777)
        UUID=${TARGET##*/}
        sudo systemctl enable --now rawstor-vhost@${UUID}.service
        sleep 1
        systemctl is-active rawstor-vhost@${UUID}.service
        test -S /run/rawstor/${UUID}.sock
        sudo systemctl disable --now rawstor-vhost@${UUID}.service
    - name: install-python3-rawstor
      run: sudo apt install -y ./python3-rawstor-${{ matrix.os }}.deb/python*-rawstor_*.deb
    - name: test-python3-rawstor
      run: python -c "import rawstor; print(list(rawstor.Location('ost://127.0.0.1:7777/'))); print('OK')"

  rpm-librawstor:
    needs: sources

    runs-on: ubuntu-latest

    container: almalinux:9

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
        dnf -y install xxhash-devel liburing-devel gtest-devel gcc-c++ make pkgconfig systemd-rpm-macros rpm-build rpmlint
    - uses: actions/download-artifact@v8
      with:
        name: sources
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf ${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure --without-python3
    - name: setuptree
      run: |
        mkdir -p ~/rpmbuild/SOURCES
        mkdir -p ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR}/rpm/librawstor.spec ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR_TAR_GZ} ~/rpmbuild/SOURCES
    - name: rpmlint
      run: rpmlint ~/rpmbuild/SPECS/librawstor.spec
    - name: rpmbuild
      run: rpmbuild -bb ~/rpmbuild/SPECS/librawstor.spec
    - name: ls
      run: |
        cd ~/rpmbuild/RPMS/x86_64
        for i in *.rpm; do \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          rpm -qlp $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: librawstor.rpm
        path: ~/rpmbuild/RPMS/x86_64/*.rpm
        if-no-files-found: error

  rpm-python3-rawstor:
    needs:
    - sources
    - rpm-librawstor

    strategy:
      matrix:
        os:
        - almalinux9
        - almalinux10
        include:
        - os: almalinux9
          image: almalinux:9
        - os: almalinux10
          image: almalinux:10

    runs-on: ubuntu-latest

    container: ${{ matrix.image }}

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
        dnf -y install xxhash-devel liburing-devel gtest-devel gcc-c++ make pkgconfig python3-devel python3-rpm-macros python3-pip python3-wheel python3-build python3-setuptools rpm-build rpmlint
    - uses: actions/download-artifact@v8
    - name: install librawstor
      run: dnf -y install ./librawstor.rpm/librawstor-[0-9]*.rpm ./librawstor.rpm/librawstor-devel-*.rpm
    - name: env
      run: |
        export LIBRAWSTOR_TAR_GZ=$(cd sources && ls librawstor-*.tar.gz)
        export LIBRAWSTOR_TAR=${LIBRAWSTOR_TAR_GZ%.*}
        export LIBRAWSTOR=${LIBRAWSTOR_TAR%.*}
        echo "LIBRAWSTOR_TAR_GZ=${LIBRAWSTOR_TAR_GZ}" >> $GITHUB_ENV
        echo "LIBRAWSTOR=${LIBRAWSTOR}" >> $GITHUB_ENV
    - name: configure
      run: |
        tar -xzf sources/${LIBRAWSTOR_TAR_GZ}
        cd ${LIBRAWSTOR}
        ./configure
    - name: setuptree
      run: |
        mkdir -p ~/rpmbuild/SOURCES
        mkdir -p ~/rpmbuild/SPECS
        cp ${LIBRAWSTOR}/rpm/python3-rawstor.spec ~/rpmbuild/SPECS
        cp sources/${LIBRAWSTOR_TAR_GZ} ~/rpmbuild/SOURCES
    - name: rpmlint
      run: rpmlint ~/rpmbuild/SPECS/python3-rawstor.spec
    - name: rpmbuild
      run: rpmbuild -bb ~/rpmbuild/SPECS/python3-rawstor.spec
    - name: ls
      run: |
        cd ~/rpmbuild/RPMS/x86_64
        for i in *.rpm; do \
          echo "# $i" >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
          rpm -qlp $i >> $GITHUB_STEP_SUMMARY; \
          echo '```' >> $GITHUB_STEP_SUMMARY
        done
    - uses: actions/upload-artifact@v7
      with:
        name: python3-rawstor-${{ matrix.os }}.rpm
        path: ~/rpmbuild/RPMS/x86_64/*.rpm
        if-no-files-found: error

  rpm-install:
    needs:
    - rpm-librawstor
    - rpm-python3-rawstor

    strategy:
      matrix:
        os:
        - almalinux9
        - almalinux10
        include:
        - os: almalinux9
          image: almalinux:9
        - os: almalinux10
          image: almalinux:10

    runs-on: ubuntu-latest

    # rawstor-ost uses io_uring at runtime, which the default container
    # seccomp profile blocks (build/install steps never execute it, only
    # this job actually runs the binary).
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined

    steps:
    - name: install dependencies
      run: |
        dnf -y install epel-release
        dnf config-manager --set-enabled crb
    - uses: actions/download-artifact@v8
    - name: install-librawstor
      run: dnf -y install ./librawstor.rpm/librawstor-[0-9]*.rpm
    - name: test-librawstor
      run: rawstor-cli --version
    - name: install-rawstor-ost
      run: dnf -y install ./librawstor.rpm/rawstor-ost-[0-9]*.rpm
    - name: test-rawstor-ost
      # containers have no systemd/PID 1, so the .service unit cannot be
      # started via systemctl here -- run the same command it would, by hand.
      run: |
        rawstor-ost --version
        rawstor-ost --bind=127.0.0.1:7777 file:///var/lib/rawstor &
        OST_PID=$!
        sleep 10
        rawstor-cli create --size=1M ost://127.0.0.1:7777
        rawstor-cli list ost://127.0.0.1:7777
        kill ${OST_PID}
    - name: install-python3-rawstor
      run: dnf -y install ./python3-rawstor-${{ matrix.os }}.rpm/python3*-rawstor-[0-9]*.rpm
    - name: test-python3-rawstor
      run: |
        mkdir -p /tmp/rawstor-install-test
        python3 -c "import rawstor; print(list(rawstor.Location('file:///tmp/rawstor-install-test'))); print('OK')"

  release:
    needs:
    - clang-format
    - sources
    - sources-unittest
    - sources-testio
    - deb-librawstor
    - deb-python3-rawstor
    - deb-install
    - rpm-librawstor
    - rpm-python3-rawstor
    - rpm-install

    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg
    - uses: actions/checkout@v7
      with:
        path: librawstor
    - name: fetch tags
      run: |
        cd librawstor
        git fetch --tags --force origin
    - name: import GPG public keys
      run: gpg --import librawstor/.github/gpg-keys/*.asc
    - name: verify
      run: |
        cd librawstor
        git verify-tag ${{ github.ref_name }}
    - uses: actions/download-artifact@v8
      with:
        path: ./artifacts
    - uses: softprops/action-gh-release@v3
      with:
        working_directory: ./artifacts
        files: |
          librawstor.deb/*
          python3-rawstor-*.deb/*
          librawstor.rpm/*
          python3-rawstor-*.rpm/*
          sources/*
