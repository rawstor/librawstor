name: perftest

on:
  push:

jobs:
  perftest:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        without-liburing:
        - 
        - --without-liburing
        # Every object goes through an MDS (chunked and placed by it, one
        # copy per chunk) onto the one store its topology lists: a local
        # directory, or a rawstor-ost serving one.
        backend:
        - file
        - ost
        bs:
        - 4k
        iodepth:
        - 1
        - 2
        numjobs:
        - 1
        include:
        - packages: liburing-dev
          without-liburing:
        - store: file:///tmp/objects
          backend: file
        - store: ost://127.0.0.1:7777
          backend: ost

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxxhash-dev libssl-dev libsqlite3-dev libtool pkg-config ${{ matrix.packages }}
    - uses: actions/checkout@v7
      with:
        path: librawstor
        fetch-depth: 0
    - name: install librawstor
      run: |
        pushd .
        cd ./librawstor
        ./autogen.sh
        ./configure --disable-shared --disable-tests --without-python3 ${{ matrix.without-liburing }}
        make -j$(nproc)
        sudo make install
        popd
    - uses: actions/checkout@v7
      with:
        repository: rawstor/fio
        path: fio
        ref: refs/heads/rawstor
    - name: install fio
      run: |
        pushd .
        cd ./fio
        ./configure
        make -j$(nproc)
        sudo make install
        popd
    - name: issue the certificates
      run: |
        mkdir ${GITHUB_WORKSPACE}/pki
        cd ${GITHUB_WORKSPACE}/pki
        TD=cluster.example
        OST_ID=$(cat /proc/sys/kernel/random/uuid)
        echo "OST_ID=${OST_ID}" >> $GITHUB_ENV
        rawstor pki init --trust-domain ${TD} ca
        rawstor pki issue --ca ca --cert ost.pem --key ost.key ost ${OST_ID}
        rawstor pki issue --ca ca --cert mds.pem --key mds.key mds perftest
        rawstor pki issue --ca ca --cert cli.pem --key cli.key admin perftest
        for who in ost mds; do
          echo "RAWSTOR_TLS_TRUST_DOMAIN=${TD} RAWSTOR_TLS_CERT=${PWD}/${who}.pem RAWSTOR_TLS_KEY=${PWD}/${who}.key RAWSTOR_TLS_CA=${PWD}/ca/ca.crt" > ${who}.env
        done
        # The rawstor and fio of the next steps are the clients.
        echo "RAWSTOR_TLS_TRUST_DOMAIN=${TD}" >> $GITHUB_ENV
        echo "RAWSTOR_TLS_CERT=${PWD}/cli.pem" >> $GITHUB_ENV
        echo "RAWSTOR_TLS_KEY=${PWD}/cli.key" >> $GITHUB_ENV
        echo "RAWSTOR_TLS_CA=${PWD}/ca/ca.crt" >> $GITHUB_ENV
    - name: (ost) start rawstor-ost
      if: "${{ matrix.backend == 'ost' }}"
      run: |
        mkdir ${GITHUB_WORKSPACE}/objects
        env $(cat ${GITHUB_WORKSPACE}/pki/ost.env) rawstor-ost --bind 127.0.0.1:7777 file://${GITHUB_WORKSPACE}/objects &
        sleep 10
    - name: start rawstor-mds
      run: |
        mkdir -p /tmp/objects
        echo "${OST_ID} ${{ matrix.store }} 100 data,witness host1" > ${GITHUB_WORKSPACE}/topology.conf
        env $(cat ${GITHUB_WORKSPACE}/pki/mds.env) rawstor-mds --bind 127.0.0.1:7776 --db ${GITHUB_WORKSPACE}/mds.db --topology ${GITHUB_WORKSPACE}/topology.conf &
        sleep 5
    - name: create object
      run: |
        target=$(rawstor object create mds://127.0.0.1:7776 --size=1G --chunk-size=256M --mirrors=1 --format value --column target)
        echo "TARGET=${target}" >> $GITHUB_ENV
        rawstor object list mds://127.0.0.1:7776
        rawstor testio ${target} --block-size=4K --io-depth=1 --count=1
    - name: fio
      run: |
        echo "# perftest" >> $GITHUB_STEP_SUMMARY
        echo "## fio ${{ matrix.without-liburing }} ${{ matrix.backend }}" >> $GITHUB_STEP_SUMMARY
        echo "### bs=${{ matrix.bs }}, iodepth=${{ matrix.iodepth }}, numjobs=${{ matrix.numjobs }}" >> $GITHUB_STEP_SUMMARY
        ./librawstor/.github/tools/fio.sh \
          ${TARGET} \
          ${{ matrix.bs }} \
          ${{ matrix.iodepth }} \
          ${{ matrix.numjobs }} \
          fio.txt \
          fio.json
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat fio.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      with:
        name: perftest${{ matrix.without-liburing }}-${{ matrix.backend }}-${{ matrix.bs }}-${{ matrix.iodepth }}-${{ matrix.numjobs }}
        path: |
          ./fio.txt
          ./fio.json
        if-no-files-found: error
    - name: remove object
      run: rawstor object remove ${TARGET}
    - name: stop rawstor-mds
      run: killall rawstor-mds
    - name: (ost) stop rawstor-ost
      if: "${{ matrix.backend == 'ost' }}"
      run: killall rawstor-ost

  export:
    needs: perftest

    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: ./perftest
    - uses: actions/checkout@v7
      with:
        path: librawstor
    - uses: actions/checkout@v7
      with:
        repository: rawstor/rawstor_bench
        path: rawstor_bench
        ref: refs/heads/main
        ssh-key: ${{ secrets.RAWSTOR_BENCH_TOKEN }}
    - name: publish
      run: |
        ./librawstor/.github/tools/git-config.sh ./librawstor

        cd ./perftest
        for perftest_name in *; do
          ${GITHUB_WORKSPACE}/rawstor_bench/tools/rawstor-bench-import \
            --prefix=${GITHUB_WORKSPACE}/rawstor_bench \
            --repo=librawstor \
            --name=${perftest_name} \
            --branch="$GITHUB_REF" \
            --commit=$GITHUB_SHA \
            --date="$(date +'%Y-%m-%dT%H:%M:%S%z')" \
            fio \
            ./${perftest_name}/fio.txt \
            ./${perftest_name}/fio.json
          done
        cd ${GITHUB_WORKSPACE}

        ./rawstor_bench/tools/rawstor-bench-compile \
          --prefix=./rawstor_bench fio

        ./librawstor/.github/tools/git-commit-and-push.sh \
          ./rawstor_bench \
          "add: perftest $GITHUB_SHA benchmarks"
